[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okno"
dynamic = ["version"]
description = "A lightweight private terminal messaging application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
]

[project.optional-dependencies]
release = [
    "pyinstaller>=6.22,<7",
]

[project.scripts]
okno = "the_grid.cli:main"

[tool.setuptools.dynamic]
version = {attr = "the_grid.version.VERSION"}

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
the_grid = ["data/grid_words.txt"]
